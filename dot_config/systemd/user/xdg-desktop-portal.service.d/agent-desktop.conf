# Agent desktops only (machine.autologin). The user manager lingers, so an
# agent's SSH session can D-Bus-activate the portal before Hyprland starts. That
# instance never sees XDG_CURRENT_DESKTOP/WAYLAND_DISPLAY, falls back to the GTK
# backend and keeps running into the session without Screenshot/ScreenCast,
# which breaks computer-use screenshots. Only start it inside the graphical
# session, so the first activation there picks the Hyprland backend.
[Unit]
Requisite=graphical-session.target
